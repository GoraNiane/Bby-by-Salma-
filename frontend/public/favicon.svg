
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A10" />
      <stop offset="100%" stop-color="#120B06" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D89A" />
      <stop offset="50%" stop-color="#E2C078" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7.68" stdDeviation="10.24" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="30.72" y="30.72" width="450.56" height="450.56" rx="112.64" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="10.24" stroke-opacity="0.3" filter="url(#goldShadow)" />

  <!-- Emblem Monogram B -->
  <text 
    x="50%" 
    y="266.24" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
    font-size="225" 
    font-weight="700" 
    fill="url(#goldGrad)"
    letter-spacing="-1"
  >B</text>

  <!-- Subtitle BBS BY SALMA -->
  <text 
    x="50%" 
    y="389.12" 
    text-anchor="middle" 
    font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
    font-size="41" 
    font-weight="700" 
    fill="#EAD5B2" 
    letter-spacing="6" 
    opacity="0.9"
  >BBS BY SALMA</text>
</svg>
